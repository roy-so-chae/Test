<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>이미지 분석기 v1.2.0</title>
    <script src="config.js" onerror="window.CONFIG = { CLAUDE_API_KEY: '' }"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .version {
            font-size: 14px;
            opacity: 0.9;
            font-weight: normal;
        }

        .content {
            padding: 30px 20px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 60px;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 15px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .image-preview {
            margin: 20px 0;
            border-radius: 10px;
            overflow: hidden;
            display: none;
            border: 2px solid #e0e0e0;
        }

        .image-preview img {
            width: 100%;
            height: auto;
            display: block;
        }

        .result-section {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            display: none;
        }

        .result-section h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .result-text {
            color: #333;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .loading {
            text-align: center;
            padding: 20px;
            display: none;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            display: none;
            border-left: 4px solid #c33;
        }

        .info {
            background: #e3f2fd;
            color: #1976d2;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            line-height: 1.5;
        }

        .api-key-saved {
            color: #4caf50;
            font-size: 12px;
            margin-top: 5px;
        }

        /* 모달 스타일 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: white;
            margin: 15% auto;
            padding: 30px;
            border-radius: 20px;
            max-width: 500px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            animation: slideDown 0.3s;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .modal-header p {
            color: #666;
            font-size: 14px;
            line-height: 1.5;
        }

        .modal-body {
            margin-bottom: 20px;
        }

        .modal-footer {
            text-align: right;
        }

        .btn-small {
            padding: 8px 15px;
            font-size: 14px;
            border-radius: 8px;
            background: #f0f0f0;
            color: #333;
            border: none;
            cursor: pointer;
            margin-left: 10px;
            transition: background 0.2s;
        }

        .btn-small:hover {
            background: #e0e0e0;
        }

        .btn-small.primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-small.primary:hover {
            box-shadow: 0 3px 10px rgba(102, 126, 234, 0.4);
        }

        .api-key-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-link {
            background: none;
            border: none;
            color: #667eea;
            cursor: pointer;
            font-size: 13px;
            text-decoration: underline;
            padding: 5px 0;
        }

        .btn-link:hover {
            color: #764ba2;
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 24px;
            }

            .content {
                padding: 20px 15px;
            }

            .modal-content {
                margin: 30% auto;
                padding: 20px;
                max-width: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>이미지 분석기 <span class="version">v1.2.0</span></h1>
        </div>

        <div class="content">
            <div class="info" id="infoMessage">
                이미지 URL을 입력하면 AI가 이미지를 분석하여 설명해드립니다.
            </div>

            <div class="input-group" id="apiKeyGroup" style="display: none;">
                <label for="apiKey">Claude API 키</label>
                <input type="text" id="apiKey" placeholder="sk-ant-api03-..." autocomplete="off" readonly>
                <div class="api-key-saved" id="apiKeySaved"></div>
                <div class="api-key-actions">
                    <button class="btn-link" onclick="openApiKeyModal()">API 키 변경</button>
                    <button class="btn-link" onclick="deleteApiKey()" style="color: #c33;">API 키 삭제</button>
                </div>
            </div>

            <div class="input-group">
                <label for="imageUrl">이미지 URL</label>
                <input type="text" id="imageUrl" placeholder="https://example.com/image.jpg">
            </div>

            <button class="btn" id="loadBtn" onclick="loadImage()">이미지 불러오기</button>

            <div class="image-preview" id="imagePreview">
                <img id="previewImg" src="" alt="미리보기">
            </div>

            <button class="btn" id="analyzeBtn" onclick="analyzeImage()" style="display: none;">이미지 분석하기</button>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>이미지를 분석하는 중...</p>
            </div>

            <div class="error" id="error"></div>

            <div class="result-section" id="resultSection">
                <h3>분석 결과</h3>
                <div class="result-text" id="resultText"></div>
            </div>
        </div>
    </div>

    <!-- API 키 설정 모달 -->
    <div id="apiKeyModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>🔑 API 키 설정</h2>
                <p>이미지 분석을 위해 Claude API 키가 필요합니다.<br>
                <small><a href="https://console.anthropic.com/" target="_blank" style="color: #667eea;">console.anthropic.com</a>에서 발급받을 수 있습니다.</small></p>
            </div>
            <div class="modal-body">
                <div class="input-group">
                    <label for="modalApiKey">Claude API 키</label>
                    <input type="text" id="modalApiKey" placeholder="sk-ant-api03-..." autocomplete="off">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-small" onclick="closeApiKeyModal()">취소</button>
                <button class="btn-small primary" onclick="saveApiKey()">저장하고 시작</button>
            </div>
        </div>
    </div>

    <script>
        // API 키 관리
        const API_KEY_STORAGE = 'claude_api_key';
        let currentApiKey = '';

        // 페이지 로드 시 API 키 자동 설정
        window.addEventListener('DOMContentLoaded', () => {
            initializeApiKey();
        });

        function initializeApiKey() {
            // 1순위: config.js에서 API 키 자동 로드
            if (window.CONFIG && window.CONFIG.CLAUDE_API_KEY &&
                window.CONFIG.CLAUDE_API_KEY !== 'your-api-key-here' &&
                window.CONFIG.CLAUDE_API_KEY !== '') {
                currentApiKey = window.CONFIG.CLAUDE_API_KEY;
                updateApiKeyDisplay('config.js에서 자동 로드됨');
                return;
            }

            // 2순위: localStorage에서 API 키 불러오기
            const savedKey = localStorage.getItem(API_KEY_STORAGE);
            if (savedKey && savedKey.trim() !== '') {
                currentApiKey = savedKey;
                updateApiKeyDisplay('저장된 API 키 사용 중');
                return;
            }

            // API 키가 없으면 모달 띄우기
            openApiKeyModal(true);
        }

        function updateApiKeyDisplay(message) {
            document.getElementById('apiKey').value = currentApiKey;
            document.getElementById('apiKeySaved').textContent = message;
            document.getElementById('apiKeyGroup').style.display = 'block';

            const infoMessage = document.getElementById('infoMessage');
            infoMessage.innerHTML = '이미지 URL을 입력하면 AI가 이미지를 분석하여 설명해드립니다.<br><small style="color: #4caf50;">✓ ' + message + '</small>';
        }

        function openApiKeyModal(required = false) {
            const modal = document.getElementById('apiKeyModal');
            const modalApiKey = document.getElementById('modalApiKey');

            modal.style.display = 'block';
            modalApiKey.value = '';
            modalApiKey.focus();

            // 필수 입력인 경우 취소 버튼 숨기기
            if (required) {
                const cancelBtn = modal.querySelector('.btn-small:not(.primary)');
                if (cancelBtn) cancelBtn.style.display = 'none';
            }
        }

        function closeApiKeyModal() {
            // API 키가 설정되어 있을 때만 닫기 허용
            if (currentApiKey) {
                document.getElementById('apiKeyModal').style.display = 'none';
            } else {
                alert('API 키를 입력해야 앱을 사용할 수 있습니다.');
            }
        }

        function saveApiKey() {
            const modalApiKey = document.getElementById('modalApiKey').value.trim();

            if (!modalApiKey) {
                alert('API 키를 입력해주세요.');
                return;
            }

            if (!modalApiKey.startsWith('sk-ant-')) {
                alert('올바른 Claude API 키 형식이 아닙니다.\nAPI 키는 "sk-ant-"로 시작해야 합니다.');
                return;
            }

            // API 키 저장
            currentApiKey = modalApiKey;
            localStorage.setItem(API_KEY_STORAGE, currentApiKey);

            updateApiKeyDisplay('API 키가 저장되었습니다');
            document.getElementById('apiKeyModal').style.display = 'none';

            // 취소 버튼 다시 표시
            const cancelBtn = document.querySelector('#apiKeyModal .btn-small:not(.primary)');
            if (cancelBtn) cancelBtn.style.display = 'inline-block';
        }

        function deleteApiKey() {
            if (confirm('저장된 API 키를 삭제하시겠습니까?')) {
                currentApiKey = '';
                localStorage.removeItem(API_KEY_STORAGE);
                document.getElementById('apiKey').value = '';
                document.getElementById('apiKeySaved').textContent = '';
                document.getElementById('apiKeyGroup').style.display = 'none';
                document.getElementById('infoMessage').innerHTML = '이미지 URL을 입력하면 AI가 이미지를 분석하여 설명해드립니다.';

                // 모달 다시 띄우기
                openApiKeyModal(true);
            }
        }

        // Enter 키로 API 키 저장
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('modalApiKey').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    saveApiKey();
                }
            });
        });

        function loadImage() {
            const imageUrl = document.getElementById('imageUrl').value.trim();
            const errorDiv = document.getElementById('error');
            const preview = document.getElementById('imagePreview');
            const previewImg = document.getElementById('previewImg');
            const analyzeBtn = document.getElementById('analyzeBtn');
            const resultSection = document.getElementById('resultSection');

            errorDiv.style.display = 'none';
            resultSection.style.display = 'none';

            if (!imageUrl) {
                showError('이미지 URL을 입력해주세요.');
                return;
            }

            // URL 유효성 검사
            try {
                new URL(imageUrl);
            } catch (e) {
                showError('유효한 URL을 입력해주세요.');
                return;
            }

            // 이미지 로드
            previewImg.onload = () => {
                preview.style.display = 'block';
                analyzeBtn.style.display = 'block';
            };

            previewImg.onerror = () => {
                showError('이미지를 불러올 수 없습니다. URL을 확인해주세요.');
                preview.style.display = 'none';
                analyzeBtn.style.display = 'none';
            };

            previewImg.src = imageUrl;
        }

        async function analyzeImage() {
            const imageUrl = document.getElementById('imageUrl').value.trim();
            const loading = document.getElementById('loading');
            const errorDiv = document.getElementById('error');
            const resultSection = document.getElementById('resultSection');
            const resultText = document.getElementById('resultText');
            const analyzeBtn = document.getElementById('analyzeBtn');
            const loadBtn = document.getElementById('loadBtn');

            errorDiv.style.display = 'none';
            resultSection.style.display = 'none';

            if (!currentApiKey) {
                showError('Claude API 키가 설정되지 않았습니다.');
                openApiKeyModal(true);
                return;
            }

            if (!imageUrl) {
                showError('이미지 URL을 입력해주세요.');
                return;
            }

            try {
                loading.style.display = 'block';
                analyzeBtn.disabled = true;
                loadBtn.disabled = true;

                // 이미지를 base64로 변환
                const base64Image = await getImageAsBase64(imageUrl);
                const mediaType = getMediaType(imageUrl);

                // Claude API 호출
                const response = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': currentApiKey,
                        'anthropic-version': '2023-06-01'
                    },
                    body: JSON.stringify({
                        model: 'claude-3-5-sonnet-20241022',
                        max_tokens: 1024,
                        messages: [{
                            role: 'user',
                            content: [
                                {
                                    type: 'image',
                                    source: {
                                        type: 'base64',
                                        media_type: mediaType,
                                        data: base64Image
                                    }
                                },
                                {
                                    type: 'text',
                                    text: '이 이미지를 자세히 분석하고 설명해주세요. 이미지에 무엇이 있는지, 어떤 상황인지, 주요 특징은 무엇인지 등을 상세히 알려주세요.'
                                }
                            ]
                        }]
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error?.message || `API 오류: ${response.status}`);
                }

                const data = await response.json();
                const analysis = data.content[0].text;

                resultText.textContent = analysis;
                resultSection.style.display = 'block';

            } catch (error) {
                console.error('분석 오류:', error);
                showError(`분석 중 오류가 발생했습니다: ${error.message}`);
            } finally {
                loading.style.display = 'none';
                analyzeBtn.disabled = false;
                loadBtn.disabled = false;
            }
        }

        async function getImageAsBase64(url) {
            // CORS 문제 해결을 위한 프록시 사용 (필요시)
            const response = await fetch(url);
            const blob = await response.blob();

            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onloadend = () => {
                    const base64 = reader.result.split(',')[1];
                    resolve(base64);
                };
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });
        }

        function getMediaType(url) {
            const extension = url.split('.').pop().toLowerCase().split('?')[0];
            const mediaTypes = {
                'jpg': 'image/jpeg',
                'jpeg': 'image/jpeg',
                'png': 'image/png',
                'gif': 'image/gif',
                'webp': 'image/webp'
            };
            return mediaTypes[extension] || 'image/jpeg';
        }

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        // Enter 키 지원
        document.getElementById('imageUrl').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                loadImage();
            }
        });
    </script>
</body>
</html>
